# cargo-deny policy (R38). The audit workflow runs both the RustSec
# advisory scan and `cargo deny check` (advisories, licenses, bans,
# sources) on a daily schedule and on manual dispatch; run
# `cargo deny check` locally before a release as well.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Apache-2.0 is this project's license; the rest are the common permissive
# licenses of the dependency tree.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
