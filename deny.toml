# cargo-deny policy (R38). Advisory scanning already runs daily in CI
# (.github/workflows/audit.yml); this file adds the license and duplicate
# checks for local runs: `cargo deny check`.
# Note: cargo-deny is not wired into CI because the audit workflow covers
# advisories; run `cargo deny check` locally before a release.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Apache-2.0 is this project's license; the rest are the common permissive
# licenses of the dependency tree.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
