name: Fuzz

# Scheduled, NON-GATING fuzz rounds (R47b): a short coverage-guided smoke
# round per target every day, plus a longer round each Monday to grow the
# corpus between releases. Findings are triaged from the run logs (crash
# inputs land in the job artifacts); the job result never blocks merges —
# see continue-on-error below. Known open findings are listed in
# fuzz/README.md.
on:
  schedule:
    # Daily, offset from the CI (17 03) and audit schedules.
    - cron: "43 04 * * *"
    # Weekly long round: Monday, after the daily slot has fired.
    - cron: "17 05 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A fuzz finding is information, not a merge gate.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [ parse_binlog, jsonb_via_row ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # nightly is deliberately UNPINNED here (a moving ref): libFuzzer's
      # coverage instrumentation requires a nightly rustc and the harness must
      # track its changes, so the SHA-pinned forms used for the stable/MSRV
      # toolchains in ci.yml do not apply to this action. checkout/rust-cache
      # below stay SHA-pinned like everywhere else.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The fuzz directory is a detached workspace with its own target
          # dir; cache it separately from the root workspace builds.
          workspaces: |
            .
            fuzz
          key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The Monday cron gets a 900 s round; the daily cron (and a manual
      # dispatch, which carries no schedule) gets the 60 s smoke round.
      - name: Resolve the round length from the trigger
        id: round
        run: |
          if [ "${{ github.event.schedule }}" = "17 05 * * 1" ]; then
            echo "seconds=900" >> "$GITHUB_OUTPUT"
            echo "label=900 s weekly round"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
            echo "label=60 s smoke round"
          fi

      - name: Fuzz ${{ matrix.target }} (${{ steps.round.outputs.label }})
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ steps.round.outputs.seconds }} -rss_limit_mb=2048
